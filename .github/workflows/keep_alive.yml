name: 24/7 Cloud Sentinel (Render & Supabase Keep-Alive)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 1. Keep Render Discord Bot Awake
        run: |
          echo "Sending pulse to Render Discord Engine..."
          curl -s -f -m 30 https://smart-bot-discord-engine.onrender.com || echo "Render pulse dispatched"

      - name: 2. Prevent Supabase 7-Day Inactivity Auto-Pause
        run: |
          echo "Sending activity pulse to Supabase..."
          curl -s -f -m 20 "https://bmofhaqqusvwisjbccqn.supabase.co/rest/v1/" || echo "Supabase pulse dispatched"
